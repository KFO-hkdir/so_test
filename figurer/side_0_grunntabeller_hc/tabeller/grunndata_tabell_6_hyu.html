<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8"/>
  <script src="https://cdn.jsdelivr.net/npm/@highcharts/grid-lite/grid-lite.js"></script>

  <style>
        html { height: 100%; overflow: hidden; margin: 0; padding: 0; box-sizing: border-box; }
        body {
          height: 100%;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          font-family: sans-serif;
          max-width: 1400px;
          margin: 0 auto;
          padding: 8px 16px;
          font-size: 13px;
          box-sizing: border-box;
        }
        h4 { font-size: 16px; margin: 0 0 12px 0; line-height: 1.25; }

        .hc-table-controls {
          display: flex; align-items: center; gap: 8px;
          margin-bottom: 10px; width: 100%; box-sizing: border-box;
        }
        .hc-table-select-wrap { flex: 1 1 auto; min-width: 0; }
        .hc-table-select-wrap select {
          font-size: 13px; padding: 6px 10px;
          border: 1px solid #ccc; border-radius: 4px;
          width: 100%; box-sizing: border-box; background: white;
        }
        .hc-table-export-wrap { flex: 0 0 auto;   margin-left: auto;}

        /* Filter row — no gap, no scroll; inputs are flush with column edges */
        .hc-filter-row {
          display: flex; gap: 0; margin-bottom: 8px;
          flex-wrap: nowrap; overflow: hidden;
        }
        .hc-filter-row input.hc-col-filter {
          flex: 1 1 0; min-width: 0;
          font-size: 13px; padding: 4px 6px;
          border: 1px solid #ccc; border-right-width: 0;
          box-sizing: border-box; background: #fafafa;
        }
        .hc-filter-row input.hc-col-filter:last-child { border-right-width: 1px; }
        .hc-filter-row input.hc-col-filter:focus { outline: none; border-color: #F58220; background: #fff; }

        /* Per-column filter widths */
  .hc-filter-row input.hc-col-filter:nth-child(1) { flex: 0 0 382px !important; width: 382px !important; min-width: 382px !important; max-width: 382px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(2) { flex: 0 0 409px !important; width: 409px !important; min-width: 409px !important; max-width: 409px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(3) { flex: 0 0 95px !important; width: 95px !important; min-width: 95px !important; max-width: 95px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(4) { flex: 0 0 95px !important; width: 95px !important; min-width: 95px !important; max-width: 95px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(5) { flex: 0 0 95px !important; width: 95px !important; min-width: 95px !important; max-width: 95px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(6) { flex: 0 0 95px !important; width: 95px !important; min-width: 95px !important; max-width: 95px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(7) { flex: 0 0 95px !important; width: 95px !important; min-width: 95px !important; max-width: 95px !important; }
  .hc-filter-row input.hc-col-filter:nth-child(8) { flex: 0 0 100px !important; width: 100px !important; min-width: 100px !important; max-width: 100px !important; }

        .hc-export-wrap { position: relative; display: inline-block; }
        .hc-export-btn {
          width: 30px; height: 30px; border: 1px solid #ccc; border-radius: 4px;
          background: white; cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
        }
        .hc-export-btn:hover { background: #f6f6f6; }
        .hc-export-menu {
          display: none; position: absolute; right: 0; top: calc(100% + 4px);
          min-width: 140px; background: white; border: 1px solid #ccc;
          border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 9999; overflow: hidden;
        }
        .hc-export-menu.open { display: block; }
        .hc-export-item {
          display: block; width: 100%; border: 0; background: white;
          text-align: left; padding: 8px 10px; cursor: pointer; font-size: 13px;
        }
        .hc-export-item:hover { background: #f6f6f6; }

        #datagrid-container { width: 100%; flex: 1 1 0; min-height: 0; overflow: hidden; }
        .hcg-container { width: 100% !important; height: 100% !important; }

        .hcg-custom-theme {
          --hcg-font-size:           13px;
          --hcg-font-family:         sans-serif;
          --hcg-padding:             6px 10px;
          --hcg-header-background:   #F58220;
          --hcg-header-color:        #ffffff;
          --hcg-header-font-size:    13px;
          --hcg-header-font-weight:  bold;
          --hcg-header-padding:      6px 10px;
          --hcg-row-odd-background:  #ffffff;
          --hcg-row-even-background: #fde9d9;
          width: 100% !important;
        }
        .hcg-custom-theme th { padding-left: 14px !important; padding-right: 14px !important; }
        .hcg-custom-theme th:not(:first-child),
        .hcg-custom-theme td:not(:first-child) { text-align: right !important; white-space: nowrap; }
        .hcg-custom-theme th:first-child,
        .hcg-custom-theme td:first-child { text-align: left !important; white-space: nowrap; }
        .hcg-custom-theme th:not(:first-child) > *,
        .hcg-custom-theme th:not(:first-child) button,
        .hcg-custom-theme th:not(:first-child) span { text-align: right !important; justify-content: flex-end !important; }

        /* Per-column cell widths */
  .hcg-container th:nth-child(1),
  .hcg-container td:nth-child(1) { width: 382px !important; min-width: 382px !important; max-width: 382px !important; }
  .hcg-container th:nth-child(2),

  .hcg-container th:nth-child(5),

  .hcg-container th:nth-child(6),

  .hcg-container th:nth-child(7),

  .hcg-container th:nth-child(8),

        /* Scroll height */
        #datagrid-container { flex: 0 0 600px !important; }
        </style>
</head>

","2021":"431","2022":"510","2023":"313","2024":"353","2025":"213"},{"Utdanningsområde":"Land- og havbruk","Nøkkeltall":"Førstevalgssøkere","2020":"302","2021":"368","2022":"411","2023":"255","2024":"292","2025":"144"},{"Utdanningsområde":"Land- og havbruk","Nøkkeltall":"Studieplasser","2020":"225","2021":"335","2022":"453","2023":"240","2024":"377","2025":"154"},{"Utdanningsområde":"Land- og havbruk","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":"50,0 %","2021":"43,5 %","2022":"41,6 %","2023":"53,3 %","2024":"58,6 %","2025":"61,1 %"},{"Utdanningsområde":"Matfag","Nøkkeltall":"Alle søkere","2020":"167","2021":"207","2022":"258","2023":"182","2024":"198","2025":"207"},{"Utdanningsområde":"Matfag","Nøkkeltall":"Førstevalgssøkere","2020":"138","2021":"166","2022":"220","2023":"154","2024":"156","2025":"160"},{"Utdanningsområde":"Matfag","Nøkkeltall":"Studieplasser","2020":"165","2021":"199","2022":"250","2023":"240","2024":"175","2025":"161"},{"Utdanningsområde":"Matfag","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":"41,3 %","2021":"44,6 %","2022":"57,7 %","2023":"61,0 %","2024":"58,3 %","2025":"58,1 %"},{"Utdanningsområde":"Pedagogiske fag","Nøkkeltall":"Alle søkere","2020":"192","2021":"407","2022":"342","2023":"328","2024":"472","2025":"433"},{"Utdanningsområde":"Pedagogiske fag","Nøkkeltall":"Førstevalgssøkere","2020":"107","2021":"230","2022":"227","2023":"209","2024":"282","2025":"269"},{"Utdanningsområde":"Pedagogiske fag","Nøkkeltall":"Studieplasser","2020":"155","2021":"405","2022":"355","2023":"305","2024":"483","2025":"330"},{"Utdanningsområde":"Pedagogiske fag","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":"74,8 %","2021":"74,8 %","2022":"81,1 %","2023":"83,7 %","2024":"82,3 %","2025":"78,8 %"},{"Utdanningsområde":"Reiseliv","Nøkkeltall":"Alle søkere","2020":"151","2021":"172","2022":"169","2023":"111","2024":"80","2025":"135"},{"Utdanningsområde":"Reiseliv","Nøkkeltall":"Førstevalgssøkere","2020":"116","2021":"119","2022":"113","2023":"55","2024":"34","2025":"72"},{"Utdanningsområde":"Reiseliv","Nøkkeltall":"Studieplasser","2020":"265","2021":"290","2022":"284","2023":"175","2024":"95","2025":"180"},{"Utdanningsområde":"Reiseliv","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":"65,5 %","2021":"70,6 %","2022":"66,4 %","2023":"69,1 %","2024":"67,6 %","2025":"77,8 %"},{"Utdanningsområde":"Teknologiske fag","Nøkkeltall":"Alle søkere","2020":"5 840","2021":"6 885","2022":"6 944","2023":"8 144","2024":"9 566","2025":"9 424"},{"Utdanningsområde":"Teknologiske fag","Nøkkeltall":"Førstevalgssøkere","2020":"5 679","2021":"6 559","2022":"6 637","2023":"7 844","2024":"9 221","2025":"9 046"},{"Utdanningsområde":"Teknologiske fag","Nøkkeltall":"Studieplasser","2020":"5 063","2021":"5 844","2022":"5 840","2023":"6 577","2024":"6 585","2025":"6 878"},{"Utdanningsområde":"Teknologiske fag","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":"8,0 %","2021":"8,1 %","2022":"8,3 %","2023":"10,8 %","2024":"12,6 %","2025":"11,4 %"},{"Utdanningsområde":"Økonomisk-administrative fag","Nøkkeltall":"Alle søkere","2020":"266","2021":"1 414","2022":"1 262","2023":"1 386","2024":"1 683","2025":"1 804"},{"Utdanningsområde":"Økonomisk-administrative fag","Nøkkeltall":"Førstevalgssøkere","2020":"160","2021":"1 017","2022":"931","2023":"1 049","2024":"1 281","2025":"1 306"},{"Utdanningsområde":"Økonomisk-administrative fag","Nøkkeltall":"Studieplasser","2020":"180","2021":"1 185","2022":"930","2023":"1 110","2024":"1 642","2025":"1 337"},{"Utdanningsområde":"Økonomisk-administrative fag","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":"48,1 %","2021":"57,7 %","2022":"56,3 %","2023":"58,2 %","2024":"60,3 %","2025":"60,3 %"},{"Utdanningsområde":"Mediefag","Nøkkeltall":"Alle søkere","2020":null,"2021":"50","2022":"115","2023":"104","2024":"116","2025":"172"},{"Utdanningsområde":"Mediefag","Nøkkeltall":"Førstevalgssøkere","2020":null,"2021":"34","2022":"76","2023":"63","2024":"66","2025":"127"},{"Utdanningsområde":"Mediefag","Nøkkeltall":"Studieplasser","2020":null,"2021":"30","2022":"70","2023":"70","2024":"50","2025":"60"},{"Utdanningsområde":"Mediefag","Nøkkeltall":"Førstevalgssøkere (kvinner)","2020":null,"2021":"26,5 %","2022":"50,0 %","2023":"47,6 %","2024":"53,0 %","2025":"62,2 %"}]}; let grid = null; 
    function renderTable(key) {
      const rawRows      = allData[key] || [];
      const filteredRows = (typeof applyFilters === "function") ? applyFilters(rawRows) : rawRows;
      const cols = { 'col_1': filteredRows.map(r => r['Utdanningsområde']),
            'col_2': filteredRows.map(r => r['Nøkkeltall']),
            'col_3': filteredRows.map(r => r['2020']),
            'col_4': filteredRows.map(r => r['2021']),
            'col_5': filteredRows.map(r => r['2022']),
            'col_6': filteredRows.map(r => r['2023']),
            'col_7': filteredRows.map(r => r['2024']),
            'col_8': filteredRows.map(r => r['2025']) };

      if (grid) {
        grid.update({ dataTable: { columns: cols } });
      } else {
        grid = Grid.grid("datagrid-container", {
          dataTable: { columns: cols },
          columnDefaults: { resizable: true },
          columns: [ { id: 'col_1', header: { format: 'Utdanningsområde' }, width: 382 },
                  { id: 'col_2', header: { format: 'Nøkkeltall' }, width: 409 },
                  { id: 'col_3', header: { format: '2020' }, width: 95 },
                  { id: 'col_4', header: { format: '2021' }, width: 95 },
                  { id: 'col_5', header: { format: '2022' }, width: 95 },
                  { id: 'col_6', header: { format: '2023' }, width: 95 },
                  { id: 'col_7', header: { format: '2024' }, width: 95 },
                  { id: 'col_8', header: { format: '2025' }, width: 100 } ],
          rendering: { theme: "hcg-theme-default hcg-custom-theme" }
        });
      }
    }
     
      document.querySelectorAll(".hc-col-filter").forEach(function(inp) { inp.value = ""; });

      const colLabels = ["Utdanningsområde","Nøkkeltall","2020","2021","2022","2023","2024","2025"];

      function getFilterValues() {
        const vals = {};
        document.querySelectorAll(".hc-col-filter").forEach(function(inp) {
          vals[inp.dataset.label] = inp.value.trim().toLowerCase();
        });
        return vals;
      }

      function applyFilters(rows) {
        const filters = getFilterValues();
        return rows.filter(function(row) {
          return colLabels.every(function(lbl) {
            const fv   = filters[lbl];
            if (!fv) return true;
            const cell = String(row[lbl] == null ? "" : row[lbl]).toLowerCase();
            return cell.includes(fv);
          });
        });
      }

      document.querySelectorAll(".hc-col-filter").forEach(function(inp) {
        inp.addEventListener("input", function() {
          const key = "default";
          renderTable(key);
        });
      });
       renderTable("default"); 
      const exportColLabels = ["Utdanningsområde","Nøkkeltall","2020","2021","2022","2023","2024","2025"];

      function sanitizeFilePart(x) {
        return String(x).trim().replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "_");
      }
      function fileNameForExport(ext) {
        if (false) return "grunndata_" + sanitizeFilePart(document.getElementById("grp-select").value) + "." + ext;
        return "grunndata." + ext;
      }
      function getCurrentVisibleRows() {
        const key     = false ? document.getElementById("grp-select").value : "default";
        const rawRows = allData[key] || [];
        return (typeof applyFilters === "function") ? applyFilters(rawRows) : rawRows;
      }
      function downloadXLSX() {
        const rows = getCurrentVisibleRows();
        const aoa  = [ exportColLabels, ...rows.map(r => exportColLabels.map(lbl => r[lbl])) ];
        const ws   = XLSX.utils.aoa_to_sheet(aoa);
        const wb   = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Tabell");
        XLSX.writeFile(wb, fileNameForExport("xlsx"));
      }

      const exportBtn     = document.getElementById("hc-export-btn");
      const exportMenu    = document.getElementById("hc-export-menu");
      const exportXlsxBtn = document.getElementById("hc-export-xlsx");

      exportBtn.addEventListener("click", function(e) { e.stopPropagation(); exportMenu.classList.toggle("open"); });
      exportXlsxBtn.addEventListener("click", function() { downloadXLSX(); exportMenu.classList.remove("open"); });
      document.addEventListener("click", function(e) {
        if (!document.getElementById("hc-export-btn").contains(e.target) &&
            !document.getElementById("hc-export-menu").contains(e.target)) {
          exportMenu.classList.remove("open");
        }
      });
      </script>
